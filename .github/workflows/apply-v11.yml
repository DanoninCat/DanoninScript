name: Apply CAT EMPIRE V11

on:
  push:
    paths:
      - .github/workflows/apply-v11.yml

permissions:
  contents: write

jobs:
  apply-v11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply V11 and commit
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/v11.patch
          git apply /tmp/v11.patch
          git rm .github/workflows/apply-v11.yml
          git config user.name 'DanoninCat'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Games/MurderDuel.lua Libs/Fluent.lua
          git commit -m 'Apply CAT EMPIRE V11 visual update'
          git push
