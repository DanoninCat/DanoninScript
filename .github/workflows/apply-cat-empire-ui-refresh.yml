name: Apply CAT EMPIRE Murder Duel UI refresh

on:
  push:
    paths:
      - .github/workflows/apply-cat-empire-ui-refresh.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify reviewed base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^:Games/MurderDuel.lua)" = "79083216d2e4f8eb39e90c66e64bcd2180f5fa54"
          test "$(git rev-parse HEAD:Games/MurderDuel.lua)" = "79083216d2e4f8eb39e90c66e64bcd2180f5fa54"

      - name: Apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > /tmp/murderduel.diff
          git apply --check /tmp/murderduel.diff
          git apply /tmp/murderduel.diff
          test "$(git hash-object Games/MurderDuel.lua)" = "bacfa73b6e017030f66cfd9abb9ac0f62b452648"

      - name: Static review gate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ! grep -q 'SilentAim' Games/MurderDuel.lua
          ! grep -q 'AimAssist' Games/MurderDuel.lua
          ! grep -q 'AimFOV' Games/MurderDuel.lua
          ! grep -q 'CameraFOV' Games/MurderDuel.lua
          ! grep -q 'Diagnóstico' Games/MurderDuel.lua
          ! grep -q 'FOVController' Games/MurderDuel.lua
          ! grep -q 'ThirdPerson' Games/MurderDuel.lua
          ! grep -q '🪣' Games/MurderDuel.lua
          grep -Fq 'local function GetESPHeadTopScreen' Games/MurderDuel.lua
          grep -Fq 'data.BoxStroke = Instance.new("UIStroke")' Games/MurderDuel.lua
          grep -Fq 'visualLeft:AddToggle("ESPBox", {Title = "Box", Default = false})' Games/MurderDuel.lua
          grep -Fq 'visualLeft:AddToggle("ESPSkeleton", {Title = "Skeleton", Default = false})' Games/MurderDuel.lua
          grep -Fq 'visualLeft:AddToggle("ESPLines", {Title = "Lines", Default = false})' Games/MurderDuel.lua
          grep -Fq 'visualRight:AddSlider("FOVRadius", {Title = "FOV Radius", Min = 30, Max = 500' Games/MurderDuel.lua
          grep -Fq 'https://discord.gg/yykVnTjd2Y' Games/MurderDuel.lua
          grep -Fq 'Content = "Danonin"' Games/MurderDuel.lua
          grep -Fq 'CustomBackgroundURL' Games/MurderDuel.lua
          grep -Fq 'Alterar Keybind' Games/MurderDuel.lua

      - name: Commit reviewed change and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CAT EMPIRE Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-cat-empire-ui-refresh.yml
          git add Games/MurderDuel.lua
          git commit -m "Refine Murder Duel UI and defaults"
          git push origin HEAD:main
