name: Finalize Murder Duel lifecycle safely

on:
  push:
    paths:
      - '.github/workflows/finalize-murderduel-lifecycle.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch cache and cleanup only
        shell: bash
        run: |
          set -euo pipefail

          test "$(git hash-object Games/MurderDuel.lua)" = "d1e710c609148b113087264d2b23b1b338513c20"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('Games/MurderDuel.lua')
          s = path.read_text(encoding='utf-8')

          ui_start = s.index('local function CreateUI()')
          ui_end = s.index('\nlocal function SetupConnections()', ui_start)
          ui_before = hashlib.sha256(s[ui_start:ui_end].encode()).hexdigest()
          Path('/tmp/ui_before.sha').write_text(ui_before)

          # 1) Add cleanup re-entry guard.
          needle = '''local WindowRef = nil\nlocal UIClosed = false\n'''
          repl = '''local WindowRef = nil\nlocal UIClosed = false\nlocal IsCleaningUp = false\n'''
          if s.count(needle) != 1:
              raise SystemExit('UIClosed boundary mismatch')
          s = s.replace(needle, repl, 1)

          # 2) Add a minimal, lazy player cache for ESP/player resolution.
          needle = '''local IsAlive\n\nlocal function GetPlayerFromCharacter(char)'''
          repl = '''local PlayerCache = {}\n\nlocal function RegisterCharacter(player, character)\n    if character then\n        PlayerCache[character] = player\n    end\nend\n\nlocal function UnregisterCharacter(character)\n    if character then\n        PlayerCache[character] = nil\n    end\nend\n\nlocal function UnregisterPlayer(player)\n    for character, cachedPlayer in pairs(PlayerCache) do\n        if cachedPlayer == player then\n            PlayerCache[character] = nil\n        end\n    end\nend\n\nlocal IsAlive\n\nlocal function GetPlayerFromCharacter(char)'''
          if s.count(needle) != 1:
              raise SystemExit('GetPlayerFromCharacter boundary mismatch')
          s = s.replace(needle, repl, 1)

          # 3) Cache resolved player while preserving the existing resolver semantics.
          old = '''local function GetPlayerFromCharacter(char)\n    if not char then\n        return nil\n    end\n\n    -- Direct Roblox character match.\n    for _, player in ipairs(Players:GetPlayers()) do\n        if player.Character == char then\n            return player\n        end\n    end\n\n    -- Some games mirror player characters under workspace.Characters.\n    local byName = Players:FindFirstChild(char.Name)\n    if byName and byName:IsA("Player") then\n        return byName\n    end\n\n    -- Attribute fallbacks for mirrored/custom character models.\n    local userId = char:GetAttribute("UserId")\n        or char:GetAttribute("PlayerUserId")\n        or char:GetAttribute("OwnerUserId")\n\n    if userId ~= nil then\n        for _, player in ipairs(Players:GetPlayers()) do\n            if player.UserId == tonumber(userId) then\n                return player\n            end\n        end\n    end\n\n    return nil\nend'''
          new = '''local function GetPlayerFromCharacter(char)\n    if not char then\n        return nil\n    end\n\n    local cached = PlayerCache[char]\n    if cached and cached.Parent == Players then\n        return cached\n    end\n\n    -- Direct Roblox character match.\n    for _, player in ipairs(Players:GetPlayers()) do\n        if player.Character == char then\n            RegisterCharacter(player, char)\n            return player\n        end\n    end\n\n    -- Attribute fallbacks are stronger than a mirrored model name.\n    local userId = char:GetAttribute("UserId")\n        or char:GetAttribute("PlayerUserId")\n        or char:GetAttribute("OwnerUserId")\n\n    if userId ~= nil then\n        for _, player in ipairs(Players:GetPlayers()) do\n            if player.UserId == tonumber(userId) then\n                RegisterCharacter(player, char)\n                return player\n            end\n        end\n    end\n\n    -- Some games mirror player characters under workspace.Characters.\n    local byName = Players:FindFirstChild(char.Name)\n    if byName and byName:IsA("Player") then\n        RegisterCharacter(byName, char)\n        return byName\n    end\n\n    return nil\nend'''
          if s.count(old) != 1:
              raise SystemExit('GetPlayerFromCharacter implementation mismatch')
          s = s.replace(old, new, 1)

          # 4) Make cleanup re-entry safe, always destroy the old window, and clear cache.
          old = '''local function Cleanup(skipWindow)\n    UIClosed = true\n    DisconnectAll()\n\n    ClearESP()\n    DestroyNamedGui(ESP_GUI_NAME)\n    DestroyNamedGui("FOVCircle")\n    FOVGui = nil\n    FOVFrame = nil\n    FOVStroke = nil\n\n    TargetData.Current = nil\n    TargetData.Position = nil\n\n    if WindowRef and not skipWindow then\n        pcall(function()\n            WindowRef:Destroy()\n        end)\n    end\n\n    WindowRef = nil\nend'''
          new = '''local function Cleanup()\n    if IsCleaningUp then\n        return\n    end\n\n    IsCleaningUp = true\n\n    local ok, err = pcall(function()\n        UIClosed = true\n        DisconnectAll()\n        table.clear(PlayerCache)\n\n        ClearESP()\n        DestroyNamedGui(ESP_GUI_NAME)\n        DestroyNamedGui("FOVCircle")\n        FOVGui = nil\n        FOVFrame = nil\n        FOVStroke = nil\n\n        ResetTargetData()\n\n        if WindowRef then\n            pcall(function()\n                WindowRef:Destroy()\n            end)\n            WindowRef = nil\n        end\n    end)\n\n    IsCleaningUp = false\n\n    if not ok then\n        warn("[CAT_EMPIRE] Cleanup error:", err)\n    end\nend'''
          if s.count(old) != 1:
              raise SystemExit('Cleanup implementation mismatch')
          s = s.replace(old, new, 1)

          # 5) Purge cache when mirrored characters or Players disappear.
          old = '''    local characters = workspace:FindFirstChild("Characters")\n    if characters then\n        table.insert(Connections, characters.ChildRemoved:Connect(function(child)\n            RemoveESP(child)\n        end))\n    end\nend'''
          new = '''    table.insert(Connections, Players.PlayerRemoving:Connect(function(player)\n        UnregisterPlayer(player)\n    end))\n\n    local characters = workspace:FindFirstChild("Characters")\n    if characters then\n        table.insert(Connections, characters.ChildRemoved:Connect(function(child)\n            UnregisterCharacter(child)\n            RemoveESP(child)\n        end))\n    end\nend'''
          if s.count(old) != 1:
              raise SystemExit('SetupConnections boundary mismatch')
          s = s.replace(old, new, 1)

          # 6) Reload cleanup must destroy the previous window too.
          old = '''    env.CAT_EMPIRE_CLEANUP = function()\n        Cleanup(true)\n    end'''
          new = '''    env.CAT_EMPIRE_CLEANUP = function()\n        Cleanup()\n    end'''
          if s.count(old) != 1:
              raise SystemExit('Global cleanup assignment mismatch')
          s = s.replace(old, new, 1)

          ui_start_after = s.index('local function CreateUI()')
          ui_end_after = s.index('\nlocal function SetupConnections()', ui_start_after)
          ui_after = hashlib.sha256(s[ui_start_after:ui_end_after].encode()).hexdigest()
          if ui_after != ui_before:
              raise SystemExit('UI block changed unexpectedly')

          path.write_text(s, encoding='utf-8')
          PY

      - name: Review pass 1 - minimal scope and syntax hygiene
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "Games/MurderDuel.lua"
          git diff --check
          grep -q 'local IsCleaningUp = false' Games/MurderDuel.lua
          grep -q 'local PlayerCache = {}' Games/MurderDuel.lua
          grep -q 'local function UnregisterPlayer(player)' Games/MurderDuel.lua

      - name: Review pass 2 - UI and approved visuals unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          s = Path('Games/MurderDuel.lua').read_text(encoding='utf-8')
          a = s.index('local function CreateUI()')
          b = s.index('\nlocal function SetupConnections()', a)
          actual = hashlib.sha256(s[a:b].encode()).hexdigest()
          expected = Path('/tmp/ui_before.sha').read_text().strip()
          if actual != expected:
              raise SystemExit('CreateUI changed')
          PY
          grep -q 'Title = "CAT EMPIRE"' Games/MurderDuel.lua
          grep -q 'Title = "Combat"' Games/MurderDuel.lua
          grep -q 'Title = "Visuals"' Games/MurderDuel.lua
          grep -q 'Title = "Misc"' Games/MurderDuel.lua
          grep -q 'Title = "Players"' Games/MurderDuel.lua
          grep -q 'Title = "Settings"' Games/MurderDuel.lua
          grep -q 'visualLeft:AddToggle("ESPBox"' Games/MurderDuel.lua
          grep -q 'visualLeft:AddToggle("ESPSkeleton"' Games/MurderDuel.lua
          grep -q 'visualLeft:AddToggle("ESPLines"' Games/MurderDuel.lua
          grep -q 'visualRight:AddSelect' Games/MurderDuel.lua
          grep -q 'local function GetESPHeadTopScreen' Games/MurderDuel.lua
          if grep -q 'CAT_EMPIRE_Highlight' Games/MurderDuel.lua; then
            echo 'Highlight regression detected'
            exit 1
          fi

      - name: Review pass 3 - lifecycle and combat regression guard
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'cached and cached.Parent == Players' Games/MurderDuel.lua
          grep -q 'table.clear(PlayerCache)' Games/MurderDuel.lua
          grep -q 'UnregisterCharacter(child)' Games/MurderDuel.lua
          grep -q 'UnregisterPlayer(player)' Games/MurderDuel.lua
          grep -q 'local function Cleanup()' Games/MurderDuel.lua
          grep -q 'IsCleaningUp = true' Games/MurderDuel.lua
          grep -q 'IsCleaningUp = false' Games/MurderDuel.lua
          grep -q 'ResetTargetData()' Games/MurderDuel.lua
          grep -q 'local function GetClosestTarget()' Games/MurderDuel.lua
          grep -q 'local function CombatTrackingLoop()' Games/MurderDuel.lua
          grep -q 'local function RefreshCombatTracking()' Games/MurderDuel.lua
          git diff --check

      - name: Commit only after all three reviews pass
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-murderduel-lifecycle.yml
          git config user.name "CAT EMPIRE"
          git config user.email "actions@users.noreply.github.com"
          git add Games/MurderDuel.lua .github/workflows/finalize-murderduel-lifecycle.yml
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/finalize-murderduel-lifecycle.yml Games/MurderDuel.lua "
          git commit -m "Harden Murder Duel UI lifecycle and ESP cache"
          git push origin HEAD:main
