name: Apply CAT EMPIRE V9

on:
  push:
    paths:
      - .github/workflows/apply-v9.yml

permissions:
  contents: write

jobs:
  apply-v9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply V9 and commit
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/cat-empire-v9.patch
          git apply --check /tmp/cat-empire-v9.patch
          git apply /tmp/cat-empire-v9.patch
          git config user.name 'CAT EMPIRE updater'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/workflows/apply-v9.yml
          git add -A
          git commit -m 'Update CAT EMPIRE mobile UI V9'
          git push origin HEAD:main
