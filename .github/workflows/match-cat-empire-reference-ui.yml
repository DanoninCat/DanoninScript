name: Use exact CAT EMPIRE reference UI

on:
  push:
    branches:
      - ui-reference-exact
    paths:
      - .github/workflows/match-cat-empire-reference-ui.yml

permissions:
  contents: write

jobs:
  exact-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-reference-exact
          fetch-depth: 0

      - name: Reconstruct exact source and adapt project UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/use_exact_reference_ui.py')
          s = p.read_text()
          s = s.replace("subprocess.run(['git','diff','--check'], check=True)", "subprocess.run(['git','diff','--check','--','Games/MurderDuel.lua'], check=True)")
          p.write_text(s)
          PY
          python3 .github/scripts/use_exact_reference_ui.py

      - name: Triple review final diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check -- Games/MurderDuel.lua
          test "$(git hash-object Libs/Fluent.lua)" = "baf6fb51b076e48e34e3c0bb2309ee7fdce509ab"
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "Games/MurderDuel.lua Libs/Fluent.lua "
          grep -q 'Title = "CAT EMPIRE"' Games/MurderDuel.lua
          grep -q 'SubTitle = "Murder Duel"' Games/MurderDuel.lua
          grep -q 'Theme = "Crimson"' Games/MurderDuel.lua
          grep -q 'MinimizeKey = Enum.KeyCode.LeftControl' Games/MurderDuel.lua
          ! grep -q 'Silent Aim' Games/MurderDuel.lua
          ! grep -q 'Aim Assist' Games/MurderDuel.lua
          ! grep -q 'Aim FOV' Games/MurderDuel.lua
          ! grep -q 'Camera FOV' Games/MurderDuel.lua

      - name: Commit exact UI output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CAT EMPIRE Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Libs/Fluent.lua Games/MurderDuel.lua
          git commit -m "Use exact CAT EMPIRE reference UI"
          git push origin HEAD:ui-reference-exact
