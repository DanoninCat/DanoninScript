name: Match CAT EMPIRE reference UI

on:
  push:
    branches:
      - ui-reference-exact
    paths:
      - .github/scripts/match_reference_ui.py

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-reference-exact
          fetch-depth: 0

      - name: Apply and review reference UI patch
        run: python3 .github/scripts/match_reference_ui.py

      - name: Validate diff
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "Games/MurderDuel.lua Libs/Fluent.lua "

      - name: Commit reviewed UI adaptation
        shell: bash
        run: |
          git config user.name "CAT EMPIRE Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Libs/Fluent.lua Games/MurderDuel.lua
          git commit -m "Match CAT EMPIRE reference UI"
          git push origin HEAD:ui-reference-exact
