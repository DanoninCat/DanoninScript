name: Apply CAT EMPIRE V10

on:
  push:
    paths:
      - .github/workflows/apply-v10.yml

permissions:
  contents: write

jobs:
  apply-v10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply V10 and commit
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/v10.patch
          git apply --check /tmp/v10.patch
          git apply /tmp/v10.patch
          rm .github/workflows/apply-v10.yml
          git config user.name "CAT EMPIRE updater"
          git config user.email "actions@users.noreply.github.com"
          git add Games/MurderDuel.lua Libs/Fluent.lua .github/workflows/apply-v10.yml
          git commit -m "Refine CAT EMPIRE UI and ESP controls"
          git push
