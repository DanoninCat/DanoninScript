name: Install exact CAT EMPIRE sidebar icons

on:
  push:
    paths:
      - '.github/workflows/install-exact-sidebar-icons.yml'

permissions:
  contents: write

jobs:
  install-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch only sidebar icon rendering
        shell: bash
        run: |
          set -euo pipefail

          test "$(git hash-object Games/MurderDuel.lua)" = "9452235ea35a6a27a2fd94c29cf5d8e2e733e7ac"
          BEFORE_LOGO="$(grep -E 'CAT_EMPIRE_sidebar_logo_v12\.jpg|CatEmpireLogo\.jpg' Libs/Fluent.lua | sha256sum | cut -d' ' -f1)"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("Libs/Fluent.lua")
          s = p.read_text(encoding="utf-8")

          if "SIDEBAR_ICON_FILES" in s:
              raise SystemExit("Exact sidebar icon loader is already installed.")

          icon_needle = '''local ICONS = {
              pc = "pc",
              eye = "eye",
              folder = "folder",
              players = "players",
              settings = "settings",
              paint = "paint",
          }

          local function DrawSidebarIcon(parent, iconName)'''

          icon_replace = '''local ICONS = {
              pc = "pc",
              eye = "eye",
              folder = "folder",
              players = "players",
              settings = "settings",
              paint = "paint",
          }

          local SIDEBAR_ICON_FILES = {
              pc = "combat.png",
              eye = "visuals.png",
              folder = "misc.png",
              settings = "settings.png",
          }

          local SidebarIconCache = {}

          local function ResolveSidebarIcon(iconName)
              local remoteName = SIDEBAR_ICON_FILES[iconName]
              if not remoteName then
                  return nil
              end

              if SidebarIconCache[iconName] ~= nil then
                  return SidebarIconCache[iconName] or nil
              end

              local env = _G
              if type(getgenv) == "function" then
                  local ok, resolved = pcall(getgenv)
                  if ok and type(resolved) == "table" then
                      env = resolved
                  end
              end

              local assetFn =
                  (env and (env.getcustomasset or env.getsynasset))
                  or rawget(_G, "getcustomasset")
                  or rawget(_G, "getsynasset")

              local writeFn =
                  (env and env.writefile)
                  or rawget(_G, "writefile")

              local isFileFn =
                  (env and env.isfile)
                  or rawget(_G, "isfile")

              if type(assetFn) ~= "function"
                  or type(writeFn) ~= "function"
              then
                  SidebarIconCache[iconName] = false
                  return nil
              end

              local localName =
                  "CAT_EMPIRE_sidebar_icon_v13_" .. remoteName

              local url =
                  "https://raw.githubusercontent.com/" ..
                  "DanoninCat/DanoninScript/main/Assets/SidebarIcons/" ..
                  remoteName

              local ok = pcall(function()
                  local exists =
                      type(isFileFn) == "function"
                      and isFileFn(localName)

                  if not exists then
                      writeFn(localName, game:HttpGet(url))
                  end
              end)

              if not ok then
                  SidebarIconCache[iconName] = false
                  return nil
              end

              local okAsset, asset = pcall(assetFn, localName)
              if okAsset and asset then
                  SidebarIconCache[iconName] = asset
                  return asset
              end

              SidebarIconCache[iconName] = false
              return nil
          end

          local function DrawSidebarIcon(parent, iconName)'''

          if s.count(icon_needle) != 1:
              raise SystemExit("Expected exactly one ICONS/DrawSidebarIcon boundary.")
          s = s.replace(icon_needle, icon_replace, 1)

          holder_needle = '''    local holder = create("Frame", {
                  BackgroundTransparency = 1,
                  BorderSizePixel = 0,
                  Size = UDim2.fromScale(1, 1),
              }, parent)

              local function line(pos, size, radius)'''

          holder_replace = '''    local holder = create("Frame", {
                  BackgroundTransparency = 1,
                  BorderSizePixel = 0,
                  Size = UDim2.fromScale(1, 1),
              }, parent)

              local exactAsset = ResolveSidebarIcon(iconName)
              if exactAsset then
                  create("ImageLabel", {
                      Name = "ExactSidebarPNG",
                      BackgroundTransparency = 1,
                      BorderSizePixel = 0,
                      Image = exactAsset,
                      ImageColor3 = C.Muted,
                      ScaleType = Enum.ScaleType.Fit,
                      Size = UDim2.fromScale(1, 1),
                  }, holder)

                  return holder
              end

              local function line(pos, size, radius)'''

          if s.count(holder_needle) != 1:
              raise SystemExit("Expected exactly one DrawSidebarIcon holder.")
          s = s.replace(holder_needle, holder_replace, 1)

          color_needle = '''        elseif obj:IsA("UIStroke") then
                      obj.Color = color
                  elseif obj:IsA("TextLabel") then
                      obj.TextColor3 = color'''

          color_replace = '''        elseif obj:IsA("UIStroke") then
                      obj.Color = color
                  elseif obj:IsA("ImageLabel")
                      or obj:IsA("ImageButton")
                  then
                      obj.ImageColor3 = color
                  elseif obj:IsA("TextLabel") then
                      obj.TextColor3 = color'''

          if s.count(color_needle) != 1:
              raise SystemExit("Expected exactly one sidebar icon color block.")
          s = s.replace(color_needle, color_replace, 1)

          p.write_text(s, encoding="utf-8")
          PY

          AFTER_LOGO="$(grep -E 'CAT_EMPIRE_sidebar_logo_v12\.jpg|CatEmpireLogo\.jpg' Libs/Fluent.lua | sha256sum | cut -d' ' -f1)"
          test "$BEFORE_LOGO" = "$AFTER_LOGO"

      - name: Review pass 1 - exact assets and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Games/MurderDuel.lua)" = "9452235ea35a6a27a2fd94c29cf5d8e2e733e7ac"
          test "$(git hash-object Assets/SidebarIcons/combat.png)" = "e7b8f31490055758d3ea97e07767e75928537eba"
          test "$(git hash-object Assets/SidebarIcons/visuals.png)" = "cd2d9fdc298ce73ad4169bfe6b1d45c799640dc1"
          test "$(git hash-object Assets/SidebarIcons/misc.png)" = "3a6d26d9a4f7adbbc62f58c7e87d8cd819b8a0e0"
          test "$(git hash-object Assets/SidebarIcons/settings.png)" = "054bdb80a2d97ac1f375ecc3da168552d8f48d5a"
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "Libs/Fluent.lua"
          git diff --check

      - name: Review pass 2 - loader and fallback integrity
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'pc = "combat.png"' Libs/Fluent.lua
          grep -q 'eye = "visuals.png"' Libs/Fluent.lua
          grep -q 'folder = "misc.png"' Libs/Fluent.lua
          grep -q 'settings = "settings.png"' Libs/Fluent.lua
          grep -q 'CAT_EMPIRE_sidebar_icon_v13_' Libs/Fluent.lua
          grep -q 'Assets/SidebarIcons/' Libs/Fluent.lua
          grep -q 'Name = "ExactSidebarPNG"' Libs/Fluent.lua
          grep -q 'obj:IsA("ImageLabel")' Libs/Fluent.lua
          grep -q 'if iconName == "pc" then' Libs/Fluent.lua
          grep -q 'elseif iconName == "eye" then' Libs/Fluent.lua
          grep -q 'elseif iconName == "folder" then' Libs/Fluent.lua
          grep -q 'elseif iconName == "settings" then' Libs/Fluent.lua
          grep -q 'CAT_EMPIRE_sidebar_logo_v12.jpg' Libs/Fluent.lua
          grep -q '"CatEmpireLogo.jpg"' Libs/Fluent.lua

      - name: Review pass 3 - V12 regression guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Games/MurderDuel.lua)" = "9452235ea35a6a27a2fd94c29cf5d8e2e733e7ac"
          grep -q 'data.BoxStroke = Instance.new("UIStroke")' Games/MurderDuel.lua
          grep -q 'local function GetESPHeadTopScreen' Games/MurderDuel.lua
          grep -q 'visualLeft:AddToggle("ESPBox"' Games/MurderDuel.lua
          grep -q 'visualLeft:AddToggle("ESPSkeleton"' Games/MurderDuel.lua
          grep -q 'visualLeft:AddToggle("ESPLines"' Games/MurderDuel.lua
          grep -q 'visualRight:AddSelect' Games/MurderDuel.lua
          grep -q 'local FOVStroke = nil' Games/MurderDuel.lua
          if grep -q 'CAT_EMPIRE_Highlight' Games/MurderDuel.lua; then
              echo "Highlight regression detected."
              exit 1
          fi
          git diff --check

      - name: Commit only after all three reviews pass
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/install-exact-sidebar-icons.yml
          git config user.name "CAT EMPIRE"
          git config user.email "actions@users.noreply.github.com"
          git add Libs/Fluent.lua .github/workflows/install-exact-sidebar-icons.yml
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/install-exact-sidebar-icons.yml Libs/Fluent.lua "
          git commit -m "Use supplied PNGs for CAT EMPIRE sidebar icons"
          git push origin HEAD:main
