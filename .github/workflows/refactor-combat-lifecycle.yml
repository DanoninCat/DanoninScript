name: Refactor CAT EMPIRE combat lifecycle

on:
  push:
    paths:
      - '.github/workflows/refactor-combat-lifecycle.yml'

permissions:
  contents: write

jobs:
  refactor-combat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch combat lifecycle only
        run: |
          set -euo pipefail
          test "$(git hash-object Games/MurderDuel.lua)" = "9452235ea35a6a27a2fd94c29cf5d8e2e733e7ac"
          test "$(git hash-object Libs/Fluent.lua)" = "08e5dfac4ba450a9ef1dd775caa3aaafb05d002f"
          python3 tools/refactor_combat_lifecycle.py
          git diff --check

      - name: Review pass 1 - independence and lifecycle
        run: |
          set -euo pipefail
          grep -q 'local function IsCombatTrackingEnabled()' Games/MurderDuel.lua
          grep -q 'local function CombatTrackingLoop()' Games/MurderDuel.lua
          grep -q 'local function RefreshCombatTracking()' Games/MurderDuel.lua
          ! grep -q 'task.spawn(AimLoop)' Games/MurderDuel.lua
          ! grep -q 'AimLoopRunning' Games/MurderDuel.lua
          ! grep -q 'Fluent.Options.SilentAim:SetValue(false)' Games/MurderDuel.lua
          ! grep -q 'Fluent.Options.AimAssist:SetValue(false)' Games/MurderDuel.lua

      - name: Review pass 2 - remove broken actuation and preserve visuals
        run: |
          set -euo pipefail
          ! grep -q 'Mouse.X = newMousePos.X' Games/MurderDuel.lua
          ! grep -q 'Mouse.Y = newMousePos.Y' Games/MurderDuel.lua
          ! grep -q 'camera.CFrame = CFrame.new' Games/MurderDuel.lua
          grep -q 'data.BoxStroke = Instance.new("UIStroke")' Games/MurderDuel.lua
          grep -q 'local function GetESPHeadTopScreen' Games/MurderDuel.lua
          grep -q 'visualLeft:AddToggle("ESPBox"' Games/MurderDuel.lua
          grep -q 'visualLeft:AddToggle("ESPSkeleton"' Games/MurderDuel.lua
          grep -q 'visualLeft:AddToggle("ESPLines"' Games/MurderDuel.lua
          grep -q 'visualRight:AddSelect' Games/MurderDuel.lua
          grep -q 'local FOVStroke = nil' Games/MurderDuel.lua
          if grep -q 'CAT_EMPIRE_Highlight' Games/MurderDuel.lua; then exit 1; fi

      - name: Review pass 3 - strict regression guard
        run: |
          set -euo pipefail
          test "$(git hash-object Libs/Fluent.lua)" = "08e5dfac4ba450a9ef1dd775caa3aaafb05d002f"
          test "$(git hash-object Assets/SidebarIcons/combat.png)" = "e7b8f31490055758d3ea97e07767e75928537eba"
          test "$(git hash-object Assets/SidebarIcons/visuals.png)" = "cd2d9fdc298ce73ad4169bfe6b1d45c799640dc1"
          test "$(git hash-object Assets/SidebarIcons/misc.png)" = "3a6d26d9a4f7adbbc62f58c7e87d8cd819b8a0e0"
          test "$(git hash-object Assets/SidebarIcons/settings.png)" = "054bdb80a2d97ac1f375ecc3da168552d8f48d5a"
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "Games/MurderDuel.lua"
          git diff --check

      - name: Commit only after all three reviews pass
        run: |
          set -euo pipefail
          rm -f .github/workflows/refactor-combat-lifecycle.yml
          rm -f tools/refactor_combat_lifecycle.py
          git config user.name "CAT EMPIRE"
          git config user.email "actions@users.noreply.github.com"
          git add Games/MurderDuel.lua .github/workflows/refactor-combat-lifecycle.yml tools/refactor_combat_lifecycle.py
          git commit -m "Refactor CAT EMPIRE combat mode lifecycle"
          git push origin HEAD:main
