name: Install CAT EMPIRE Logo

on:
  push:
    paths:
      - '.github/workflows/install-cat-assets.yml'

permissions:
  contents: write

jobs:
  install-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch only the sidebar logo loader
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Games/MurderDuel.lua)" = "9452235ea35a6a27a2fd94c29cf5d8e2e733e7ac"
          test "$(wc -c < Assets/CatEmpireLogo.png)" -gt 5000

          python3 - <<'PY'
          from pathlib import Path

          p = Path('Libs/Fluent.lua')
          s = p.read_text(encoding='utf-8')

          replacements = [
              (
                  'local fileName = "CAT_EMPIRE_sidebar_logo.jpg"',
                  'local fileName = "CAT_EMPIRE_sidebar_logo_v12.png"',
              ),
              (
                  '"CatEmpireLogo.jpg"',
                  '"CatEmpireLogo.png"',
              ),
          ]

          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'Expected exactly one occurrence: {old!r}')
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Review pass 1 - scope and asset
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Games/MurderDuel.lua)" = "9452235ea35a6a27a2fd94c29cf5d8e2e733e7ac"
          test "$(wc -c < Assets/CatEmpireLogo.png)" -gt 5000
          test "$(git diff --name-only)" = "Libs/Fluent.lua"
          grep -Fq 'CAT_EMPIRE_sidebar_logo_v12.png' Libs/Fluent.lua
          grep -Fq 'CatEmpireLogo.png' Libs/Fluent.lua
          ! grep -Fq 'CAT_EMPIRE_sidebar_logo.jpg' Libs/Fluent.lua
          ! grep -Fq 'CatEmpireLogo.jpg' Libs/Fluent.lua
          echo 'Review pass 1: OK'

      - name: Review pass 2 - UI regression guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path('Libs/Fluent.lua').read_text(encoding='utf-8')

          assert s.count('local SetSidebarIconColor') == 1
          assert s.count('SetSidebarIconColor = function') == 1
          assert s.index('local SetSidebarIconColor') < s.index('function Window:_selectTab')
          assert s.index('function Window:_selectTab') < s.index('SetSidebarIconColor = function')
          assert 'function Window:SetScale' in s
          assert 'function Window:GetScale' in s
          assert 'CAT_EMPIRE_Toggle' in s
          assert 'function Container:AddSelect' in s
          assert 'local function DrawSidebarIcon' in s
          assert 'local fallback = text(' in s
          print('Review pass 2: OK')
          PY

      - name: Review pass 3 - V12 visuals untouched
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          m = Path('Games/MurderDuel.lua').read_text(encoding='utf-8')

          required = [
              'Box = true',
              'Skeleton = true',
              'Name = true',
              'Distance = true',
              'Lines = true',
              'GetESPHeadTopScreen',
              'camera.ViewportSize.X * 0.5',
              'data.Line = NewLine("Line_" .. char.Name, gui, 1)',
              'BindESPColorSelect',
              '"White", "Red", "Blue", "Purple", "Pink"',
              'outline.Thickness = 1',
              'ESPPreview',
          ]
          missing = [token for token in required if token not in m]
          if missing:
              raise SystemExit('V12 regression: ' + ', '.join(missing))

          assert 'ESP_Highlight' not in m
          print('Review pass 3: OK')
          PY
          git diff --check

      - name: Commit only after all three reviews pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CAT EMPIRE'
          git config user.email 'actions@users.noreply.github.com'
          git add Libs/Fluent.lua
          git commit -m 'Use supplied CAT EMPIRE logo in sidebar'
          git push
